<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>位置プラス Base · Mở trong app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --card: #1B2336;
      --fg: #F8FAFC;
      --muted: #94A3B8;
      --border: #2B3550;
      --accent-text: #4ADE80;
      --accent-soft: rgba(34, 197, 94, 0.12);
      --ring: #F8FAFC;
      --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F1F5F9;
        --card: #FFFFFF;
        --fg: #0F172A;
        --muted: #475569;
        --border: #E2E8F0;
        --accent-text: #15803D;
        --accent-soft: rgba(21, 128, 61, 0.10);
        --ring: #0F172A;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--bg); color: var(--fg);
      font-family: var(--font-sans); font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: 8px; }
    .card {
      width: 100%; max-width: 400px;
      padding: 32px 24px 24px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      text-align: center;
    }
    .app-icon {
      width: 64px; height: 64px; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 16px; background: var(--accent-soft); color: var(--accent-text);
    }
    .app-icon svg { width: 32px; height: 32px; }
    h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; font-weight: 700; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
    .badge { display: inline-block; border-radius: 10px; }
    .badge img { display: block; height: 48px; width: auto; }
    .path {
      margin: 24px 0 0; padding: 12px 0 0;
      font-family: var(--font-mono); font-size: 12px; color: var(--muted);
      text-align: left; overflow-wrap: anywhere;
      border-top: 1px solid var(--border);
    }
    .path b { display: block; font-family: var(--font-sans); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
    .home { display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; padding: 0 12px; color: var(--accent-text); font-size: 15px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
    </div>
    <h1>位置プラス Base</h1>
    <p>Link này được mở bằng app. Nếu app không tự mở, hãy cài app từ App Store rồi thử lại.</p>
    <a class="badge" href="https://apps.apple.com/jp/app/id1501472393">
      <img src="https://developer.apple.com/app-store/marketing/guidelines/images/badge-download-on-the-app-store.svg" alt="Download on the App Store" width="144" height="48">
    </a>
    <div class="path" id="path" hidden><b>Đường dẫn</b><span id="path-value"></span></div>
    <a class="home" href="/">Về trang test</a>
  </main>
  <script>
    (function () {
      var v = location.pathname + location.search;
      if (v && v !== '/') {
        try { v = decodeURIComponent(v); } catch (e) {}
        document.getElementById('path-value').textContent = v;
        document.getElementById('path').hidden = false;
      }
    })();
  </script>
</body>
</html>
